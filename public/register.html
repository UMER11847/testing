<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container auth-form">
    <h2>Register Account</h2>
    <form id="registerForm">
        <input placeholder="Full Name" id="name" required />
        <input placeholder="Email Address" id="email" type="email" required />
        <input placeholder="Password" id="password" type="password" required />
        <label for="role">Your Role:</label>
        <select id="role">
            <option value="Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Employee" selected>Employee</option>
        </select>
        <button type="submit" class="button">Register</button>
        <p class="link-text">Already have an account? <a href="login.html">Login here</a></p>
    </form>
</div>

<script>
document.getElementById('registerForm').onsubmit = async e => {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

    const data = { name, email, password, role };
    
    const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    
    const result = await res.json();
    
    alert(result.message);

    if (result.success) {
        window.location.href = 'login.html'; // Redirect on success
    }
};
</script>
</body>
</html>
