<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container auth-form">
        <h2>Login to Task Manager</h2>
        <form id="loginForm">
            <input id="email" type="email" placeholder="Email" required>
            <input id="password" type="password" placeholder="Password" required>
            <button type="submit" class="button">Login</button>
            <button type="button" id="gmailLoginBtn" class="button google-btn"
                style="background-color: #db4437; margin-top: 10px;">Login with Gmail</button>
            <p class="link-text">Don't have an account? <a href="register.html">Register now</a></p>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>

</html>
